<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NqiZbali — Payment Cancelled</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#fff8f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .card{background:#fff;border-radius:20px;box-shadow:0 4px 32px rgba(0,0,0,.08);max-width:400px;width:100%;padding:2.5rem 2rem;text-align:center}
    .icon{font-size:3.5rem;margin-bottom:1rem}
    h1{font-size:1.3rem;font-weight:800;color:#c0392b;margin-bottom:.5rem}
    p{font-size:.88rem;color:#666;line-height:1.6;margin-bottom:1.25rem}
    .btn{display:inline-block;background:linear-gradient(135deg,#1a7c3e,#25a25a);color:#fff;text-decoration:none;border-radius:10px;padding:.72rem 1.6rem;font-size:.9rem;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Payment Cancelled</h1>
    <p>The payment was not completed.<br/>No amount was charged. You can try again at any time.</p>
    <a class="btn" href="/syndic/dashboard">Back to Dashboard</a>
  </div>
</body>
</html>
