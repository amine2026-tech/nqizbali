<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NqiZbali — Resident Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;background:#F2F2F7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;-webkit-font-smoothing:antialiased}
    .card{background:#fff;border-radius:28px;box-shadow:0 8px 40px rgba(0,0,0,.1);width:100%;max-width:400px;overflow:hidden}
    .header{background:linear-gradient(145deg,#0a3d20,#1a7c3e);padding:2.5rem 2rem;text-align:center;color:#fff}
    .logo{width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;box-shadow:0 8px 24px rgba(0,0,0,.15)}
    .header h1{font-size:1.4rem;font-weight:800;letter-spacing:-.3px}
    .header p{font-size:.82rem;opacity:.7;margin-top:.3rem}
    .body{padding:2rem}
    .field{margin-bottom:1.1rem}
    label{display:block;font-size:.75rem;font-weight:700;color:#6C6C70;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px}
    input{width:100%;border:1.5px solid #E5E5EA;border-radius:14px;padding:.85rem 1rem;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;background:#F9F9F9;color:#1C1C1E}
    input:focus{border-color:#1a7c3e;box-shadow:0 0 0 4px rgba(26,124,62,.1);background:#fff}
    input[name="qr_code"]{text-transform:uppercase;letter-spacing:2px;font-weight:700;font-family:monospace;font-size:.9rem}
    .btn{width:100%;background:linear-gradient(135deg,#1a7c3e,#25a25a);color:#fff;border:none;border-radius:14px;padding:1rem;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(26,124,62,.3);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
    .btn:active{transform:scale(.97)}
    .error{background:#FEE2E2;border:1.5px solid #FECACA;border-radius:12px;padding:.75rem 1rem;font-size:.82rem;color:#991B1B;margin-bottom:1rem}
    .qr-hint{background:#F9F9F9;border-radius:14px;padding:.9rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:.75rem;font-size:.8rem;color:#6C6C70}
    .qr-hint-icon{font-size:1.8rem;flex-shrink:0}
    .demo{background:#FEF3C7;border:1.5px dashed #F59E0B;border-radius:12px;padding:.75rem 1rem;font-size:.75rem;color:#92400E;margin-bottom:1.25rem;line-height:1.7}
    .back{display:block;text-align:center;font-size:.8rem;color:#AEAEB2;margin-top:1rem;text-decoration:none;font-weight:600}
    .page-transition{position:fixed;inset:0;background:#fff;z-index:99999;pointer-events:none;opacity:0;transition:opacity .25s ease}
    .page-transition.in{opacity:1}
  </style>
</head>
<body>
  <div class="page-transition" id="pt"></div>
  <div class="card">
    <div class="header">
      <div class="logo">🏠</div>
      <h1>Resident Login</h1>
      <p>Enter your QR code and phone number</p>
    </div>
    <div class="body">
      <div class="qr-hint">
        <div class="qr-hint-icon">🏷️</div>
        <div>Your QR code is on the <strong>sticker on your door</strong>. It looks like <strong>NQZ-MRK-0001</strong>.</div>
      </div>
      <div class="demo">🧪 Demo QR codes: <strong>NQZ-MRK-0001</strong> · <strong>NQZ-MRK-0002</strong> · <strong>NQZ-MRK-0003</strong><br>Phone: any number</div>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="field">
          <label>QR Code</label>
          <input name="qr_code" required placeholder="NQZ-MRK-0001"/>
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input name="phone" type="tel" required placeholder="06 XX XX XX XX"/>
        </div>
        <button class="btn" type="submit">📱 Send verification code</button>
      </form>
      <a class="back" href="/">← Back to home</a>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
</body>
</html>
