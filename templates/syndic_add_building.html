<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NqiZbali — Add Building</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Inter',sans-serif;background:#F2F2F7;min-height:100vh;-webkit-font-smoothing:antialiased}
    nav{background:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
    nav a{color:#1a7c3e;text-decoration:none;font-size:.85rem;font-weight:600}
    nav .title{font-size:1rem;font-weight:800;color:#1C1C1E}
    .container{max-width:520px;margin:0 auto;padding:1.5rem 1rem 3rem}
    .card{background:#fff;border-radius:24px;box-shadow:0 4px 24px rgba(0,0,0,.07);padding:1.75rem}
    .field{margin-bottom:1.1rem}
    label{display:block;font-size:.75rem;font-weight:700;color:#6C6C70;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px}
    input,select{width:100%;border:1.5px solid #E5E5EA;border-radius:14px;padding:.8rem 1rem;font-size:.93rem;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;background:#F9F9F9;color:#1C1C1E;-webkit-appearance:none}
    input:focus,select:focus{border-color:#1a7c3e;box-shadow:0 0 0 4px rgba(26,124,62,.1);background:#fff}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
    .price-preview{background:#F0FDF4;border:1.5px solid #D1FAE5;border-radius:14px;padding:.9rem 1.1rem;margin-bottom:1.25rem;font-size:.88rem;color:#065F46;display:none}
    .price-big{font-size:1.5rem;font-weight:900;color:#1a7c3e}
    .btn{width:100%;background:linear-gradient(135deg,#1a7c3e,#25a25a);color:#fff;border:none;border-radius:14px;padding:.9rem;font-size:.98rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(26,124,62,.3);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
    .btn:active{transform:scale(.97)}
    .error{background:#FEE2E2;border:1.5px solid #FECACA;border-radius:12px;padding:.65rem 1rem;font-size:.82rem;color:#991B1B;margin-bottom:1rem}
    .page-transition{position:fixed;inset:0;background:#fff;z-index:99999;pointer-events:none;opacity:0;transition:opacity .25s ease}
    .page-transition.in{opacity:1}
  </style>
</head>
<body>
  <div class="page-transition" id="pt"></div>
  <nav>
    <a href="/syndic/dashboard">← Back</a>
    <span class="title">Add Building</span>
  </nav>
  <div class="container">
    <div class="card">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="POST">
        <div class="field"><label>Building / Residence Name</label><input name="name" required placeholder="e.g. Residence Al Amal"/></div>
        <div class="field"><label>Address</label><input name="address" required placeholder="Street, number..."/></div>
        <div class="field">
          <label>Neighborhood</label>
          <select name="neighborhood" required>
            <option value="">— Select —</option>
            <option>Massira I</option><option>Massira II</option><option>Massira III</option>
            <option>M'hamid 6</option><option>M'hamid 7</option><option>M'hamid 8</option>
            <option>Daoudiate</option><option>Gueliz</option><option>Hivernage</option>
            <option>Medina</option><option>Targa</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Number of Apartments</label>
          <input name="nb_apartments" id="nb" type="number" min="1" max="500" required placeholder="e.g. 8" oninput="calc()"/>
        </div>
        <div class="row">
          <div class="field"><label>Latitude (optional)</label><input name="lat" type="number" step="any" placeholder="31.6258"/></div>
          <div class="field"><label>Longitude (optional)</label><input name="lng" type="number" step="any" placeholder="-8.0038"/></div>
        </div>
        <div class="price-preview" id="pp">
          💰 Monthly total: <span class="price-big" id="tot">0</span> DH
          <div style="font-size:.72rem;color:#065F46;margin-top:.2rem">{{ price_per_apt }} DH × <span id="cnt">0</span> apartments</div>
        </div>
        <button class="btn" type="submit">Save Building</button>
      </form>
    </div>
  </div>
  <script>
    function calc(){
      const n=parseInt(document.getElementById('nb').value)||0;
      const pp=document.getElementById('pp');
      if(n>0){pp.style.display='block';document.getElementById('tot').textContent=n*{{ price_per_apt }};document.getElementById('cnt').textContent=n}
      else pp.style.display='none';
    }
  </script>
  <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
</body>
</html>
