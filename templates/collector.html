<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>NqiZbali — Collector</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #collector-map {
      height: 360px;
      border-radius: 16px;
      overflow: hidden;
      border: 0.5px solid #CFD8DC;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .map-wrapper { position: relative; }
    .map-center-btn {
      position: absolute;
      bottom: 18px;
      right: 12px;
      z-index: 999;
      background: white;
      border: none;
      border-radius: 10px;
      width: 40px;
      height: 40px;
      font-size: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-filter-btn {
      position: absolute;
      bottom: 18px;
      left: 12px;
      z-index: 999;
      background: white;
      border: none;
      border-radius: 10px;
      padding: 0 12px;
      height: 40px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      cursor: pointer;
      color: #1A2332;
    }
    .route-card {
      background: #f0faf4;
      border: 1px solid #d1f0dc;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .route-icon { font-size: 22px; flex-shrink: 0; }
    .route-text { flex: 1; font-size: 12px; color: #0d4f29; font-weight: 600; }
    .route-badge { background: #1a7c3e; color: white; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 700; }
    .client-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .client-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e8edf2;
      cursor: pointer;
      transition: background 0.15s;
    }
    .client-row.ready { border-color: #ffd54f; background: #fffde7; }
    .client-row.collected { border-color: #c8e6c9; background: #f1f8f2; opacity: 0.7; }
    .client-row.violation { border-color: #ffcdd2; background: #fff5f5; }
    .client-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .client-info { flex: 1; min-width: 0; }
    .client-name { font-size: 13px; font-weight: 700; color: #1A2332; }
    .client-addr { font-size: 11px; color: #607D8B; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-btn { border: none; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .mini-btn-green { background: #2E7D32; color: white; }
    .mini-btn-gray { background: #e0e0e0; color: #607D8B; }
  </style>
</head>
<body>
<div class="app-container">

  <div class="top-bar">
    <a href="/" class="back-btn">← Home</a>
    <span class="top-bar-title">♻️ NQIZBALI</span>
    <span class="top-bar-time" id="clock">--:--</span>
  </div>

  <div class="content">

    <div class="card card-dark">
      <div class="profile-row">
        <div class="avatar avatar-teal">YB</div>
        <div>
          <div class="profile-name" style="color:white">Youssef Benaissa</div>
          <div class="profile-sub" style="color:#ffffff88">🚛 Collector · M'hamid–Massira zone</div>
        </div>
        <div style="margin-left:auto">
          <span class="badge badge-green">
            <span class="pulse-dot"></span> On duty
          </span>
        </div>
      </div>
      <div class="info-row">
        <div class="info-pill" style="background:#ffffff18;color:#ffffffcc">📍 Massira II</div>
        <div class="info-pill" style="background:#ffffff18;color:#ffffffcc">🕐 <span id="clock2">--:--</span></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏠</div>
        <div class="stat-val" id="stat-total">0</div>
        <div class="stat-label">Total homes</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🗑️</div>
        <div class="stat-val" id="stat-ready" style="color:#E65100">0</div>
        <div class="stat-label">Ready now</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-val" id="stat-collected" style="color:#2E7D32">0</div>
        <div class="stat-label">Collected</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⚠️</div>
        <div class="stat-val" id="stat-violations" style="color:#C62828">0</div>
        <div class="stat-label">Violations</div>
      </div>
    </div>

    <div class="route-card" id="route-card" style="display:none">
      <span class="route-icon">🗺️</span>
      <div class="route-text" id="route-text">Loading route...</div>
      <span class="route-badge" id="route-badge">0 stops</span>
    </div>

    <div class="card">
      <div class="card-title">🗺️ Live collection map</div>
      <div class="map-wrapper">
        <div id="collector-map"></div>
        <button class="map-center-btn" onclick="centerMap()">🎯</button>
        <button class="map-filter-btn" id="filter-btn" onclick="toggleFilter()">🗑️ Ready only</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#ffd54f"></div> Ready</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2E7D32"></div> Collected</div>
        <div class="legend-item"><div class="legend-dot" style="background:#C62828"></div> Violation</div>
        <div class="legend-item"><div class="legend-dot" style="background:#CFD8DC"></div> Waiting</div>
        <div class="legend-item"><div
