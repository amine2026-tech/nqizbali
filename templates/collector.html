<!-- QR Scanner -->
    <div class="card">
      <div class="card-title">📷 QR Scanner</div>
      <div class="scanner-box" id="scanner-box">
        <div class="scan-corner scan-corner-tl"></div>
        <div class="scan-corner scan-corner-tr"></div>
        <div class="scan-corner scan-corner-bl"></div>
        <div class="scan-corner scan-corner-br"></div>
        <div id="scan-content">
          <div class="scan-idle">
            <div class="scan-idle-icon">▦</div>
            <div>Point at the QR sticker</div>
          </div>
        </div>
        <div id="scan-line" class="scan-line" style="display:none;top:20%"></div>
      </div>
      <div id="scan-btn-area">
        <button class="btn btn-teal" onclick="startScan()">📷 Simulate QR Scan</button>
      </div>
      <div id="action-buttons" style="display:none">
        <div class="action-row">
          <button class="btn btn-green" onclick="markCollected()">✅ Collected</button>
          <button class="btn btn-red"   onclick="openViolModal()">📸 Violation</button>
        </div>
      </div>
    </div>
